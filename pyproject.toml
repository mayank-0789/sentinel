[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "anthropic",
    "mcp",
    "httpx",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "pyyaml",
    "pydantic-settings",
    "docker",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "playwright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
